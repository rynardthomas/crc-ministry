<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- ▼▼ Paste your app link here (Deploy → Manage deployments → Web app URL, ends in /exec) ▼▼ -->
<script>var APP_URL = 'https://script.google.com/macros/s/AKfycbyEuRfVPImgeDeWznEzKOX2Sa2ufpSSW9bdMhTcz-GvQlSKnDYhZEj5RxWVeGFaNjfu/exec';</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRC Ministry</title>
<meta name="theme-color" content="#07070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="CRC Ministry">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #07070a; color: #f2f2f5; font: 15px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
  /* the app handles the notch at the top; here we keep it clear of the home bar at the bottom */
  #app { position: fixed; top: 0; left: 0; right: 0; bottom: env(safe-area-inset-bottom); width: 100%; height: calc(100% - env(safe-area-inset-bottom)); border: 0; background: #07070a; }
  .msg { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 28px; background: #07070a; z-index: 2; }
  .msg.on { display: grid; }
  .msg img { width: 84px; height: 84px; border-radius: 22px; margin-bottom: 18px; }
  .msg h1 { font-size: 22px; margin: 0 0 8px; }
  .msg p { margin: 0 auto 18px; color: #9a9aa6; max-width: 320px; }
  .msg button { font: inherit; font-weight: 600; padding: 12px 22px; border-radius: 999px; border: 0; background: #F5A524; color: #000; }
  .boot { position: fixed; inset: 0; display: grid; place-items: center; z-index: 1; background: #07070a; transition: opacity .3s; pointer-events: none; }
  .boot img { width: 96px; height: 96px; border-radius: 26px; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; transform: scale(.97); } }
</style>
</head>
<body>
<div class="boot" id="boot"><img src="icon-192.png" alt=""></div>
<iframe id="app" title="CRC Ministry" allow="camera; microphone; clipboard-write; fullscreen; web-share"></iframe>
<div class="msg" id="offline"><div><img src="icon-192.png" alt=""><h1>No connection</h1><p>The app needs signal to open. Things you saved on your phone are safe and will send once you're back online.</p><button onclick="start()">Try again</button></div></div>
<div class="msg" id="setup"><div><img src="icon-192.png" alt=""><h1>Almost there</h1><p>Open <b>index.html</b> and paste the app link (ends in <b>/exec</b>) where it says PASTE-YOUR-APP-LINK-HERE.</p></div></div>
<script>
  function start() {
    var off = document.getElementById('offline'), frame = document.getElementById('app'), boot = document.getElementById('boot');
    if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(APP_URL)) { document.getElementById('setup').classList.add('on'); return; }
    if (navigator.onLine === false) { off.classList.add('on'); return; }
    off.classList.remove('on');
    // pass anything after ? through (e.g. ?checkin=pot from a QR code, or ?channel=beta)
    frame.src = APP_URL + (location.search || '');
    frame.onload = function () { boot.style.opacity = 0; };
    setTimeout(function () { boot.style.opacity = 0; }, 6000);
  }
  window.addEventListener('online', function () { if (document.getElementById('offline').classList.contains('on')) start(); });
  start();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
